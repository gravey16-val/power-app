# Render deployment config.
# On Render, all configuration comes from the environment — there are no
# hardcoded fallbacks. DATABASE_URL is supplied by the managed Postgres, and the
# backend binds to the platform-injected $PORT.
services:
  - type: web
    name: weather-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: CORS_ORIGINS
        # Set to the deployed frontend origin (no wildcard with credentials).
        sync: false

  - type: web
    name: weather-frontend
    env: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    rootDir: ./frontend
    envVars:
      - key: VITE_API_URL
        sync: false

databases:
  - name: weather-db
    databaseName: weatherdb
    user: weather
    plan: free
