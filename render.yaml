# render.yaml — Render Blueprint for the Weather Dashboard
#
# Defines three Render resources:
#   1. weather-backend   — FastAPI Web Service (Python)
#   2. weather-frontend  — Vite/React Static Site
#   3. weather-db        — managed PostgreSQL 16 instance
#
# DATABASE_URL is injected into the backend from the managed Postgres
# connection string; VITE_API_URL is baked into the frontend build so the
# Axios client points at the deployed backend.
#
# Canonical reference: ARCHITECTURE.md §Deployment (Render).
# Validate with: `render blueprint validate` (Render CLI) or a YAML linter.

services:
  # ---------------------------------------------------------------------------
  # Backend — FastAPI + Uvicorn web service
  # ---------------------------------------------------------------------------
  - type: web
    name: weather-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      # Injected from the managed Postgres instance defined below.
      - key: DATABASE_URL
        fromDatabase:
          name: weather-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.12.4"
      - key: PYTHONUNBUFFERED
        value: "1"

  # ---------------------------------------------------------------------------
  # Frontend — Vite-built React static site
  # ---------------------------------------------------------------------------
  - type: web
    name: weather-frontend
    runtime: static
    rootDir: frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeploy: true
    # VITE_* vars are read at build time and baked into the static bundle.
    # The value is the public URL of the backend Web Service above.
    envVars:
      - key: VITE_API_URL
        value: https://weather-backend.onrender.com
    # SPA fallback: serve index.html for client-side routes.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# -----------------------------------------------------------------------------
# Database — managed PostgreSQL 16
# -----------------------------------------------------------------------------
databases:
  - name: weather-db
    databaseName: weatherdb
    user: weather
    plan: free
    region: oregon
    postgresMajorVersion: "16"
